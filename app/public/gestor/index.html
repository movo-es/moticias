<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Gestor · MOTICIAS</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#141414;--mute:#6b6f6c;--line:#e3e4e1;--acc:#1c6b4a;--warn:#a15c00;--bad:#a12b2b;--soft:#f4f6f5}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:12px 16px calc(10px);display:flex;align-items:center;gap:10px}
header b{font-size:17px;letter-spacing:.02em;white-space:nowrap}header small{opacity:.65;margin-left:auto;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{position:sticky;top:46px;z-index:4;display:flex;background:#111;padding:0 8px 8px;gap:6px;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:#2a2a2a;color:#ddd;border:0;border-radius:18px;padding:8px 12px;font-size:14px}
nav button.on{background:#fff;color:#111;font-weight:600}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute);font-size:13px}
h1{font-size:20px;margin:4px 0 8px}h2{font-size:16px;margin:0 0 6px}
.chip{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:#eee;color:#333}
.chip.pub{background:#e3f1ea;color:var(--acc)}.chip.pro{background:#fff1dd;color:var(--warn)}.chip.ret{background:#f3e3e3;color:var(--bad)}
button.b{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;padding:10px 14px;font-size:15px;min-height:44px}
button.b2{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font-size:15px;min-height:44px}
button.bad{border-color:var(--bad);background:#fff;color:var(--bad)}
button:disabled{opacity:.5}
a.b2,a.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:9px;text-decoration:none}a.b2{border:1px solid var(--line);background:#fff;color:var(--ink)}a.b{background:var(--ink);color:#fff}
.filtros{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px}
.filtros button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}
.filtros button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;font:inherit;color:inherit}
.item .t{font-weight:600;line-height:1.3;margin:2px 0 6px}
.caja{background:var(--soft);border-left:3px solid #c9d2cd;border-radius:6px;padding:12px;margin:10px 0}
.caja .et{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7a837e;margin:0 0 6px}
textarea,input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:110px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-size:14px;min-height:44px}
.seg button.on{background:var(--ink);color:#fff}
.vista{font-family:Georgia,serif;font-size:15px;line-height:1.55;max-height:60vh;overflow:auto;border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.vista aside{outline:2px dashed var(--acc);outline-offset:3px}
#aviso{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;background:#111;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;display:none}
#aviso.err{background:var(--bad)}
.vacio{text-align:center;color:var(--mute);padding:30px 10px}
details summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 0}
.cand{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.cand:first-child{border-top:0}
.barra{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px}.barra i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}.tabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.jefe{border-color:#111}.jefe h2{display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:900px){main.ancho{max-width:1180px}.grid2{grid-template-columns:1fr 1fr}}
.prev{font-family:Georgia,serif;font-size:15px;line-height:1.55;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fffdf8}
.prev h3{font-family:inherit;font-size:20px;margin:0 0 6px}.prev .sub{color:#555;margin:0 0 10px}
.marca{background:#fff1c2;padding:0 2px;border-radius:3px}
.warn{background:#fff6e6;border:1px solid #e7c48d;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.okbox{background:#eef6f1;border:1px solid #bcd9c8;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:3px}
.ad-prev{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.ad-prev .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7a837e}
.ad-prev b{display:block;margin:4px 0}.ad-prev u{color:var(--acc)}
.kpi{display:flex;gap:16px;flex-wrap:wrap}.kpi div b{font-size:22px;display:block}
.paso{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}.paso:first-child{border-top:0}
.venc{color:var(--bad);font-weight:600}.hoy{color:var(--warn);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#111;border-radius:50%;animation:g 1s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><b>MOTICIAS · Gestor</b><small id="quien"></small><button id="salir" hidden style="margin-left:8px;background:none;border:1px solid #555;color:#ddd;border-radius:14px;padding:4px 10px;font-size:12px">Salir</button></header>
<nav id="nav" hidden>
  <button data-v="piezas" class="on">Piezas</button>
  <button data-v="noticia" hidden>Nueva noticia</button>
  <button data-v="anuncios">Publicidad</button>
  <button data-v="crm" hidden>CRM</button>
  <button data-v="prensa" hidden>Prensa</button>
  <button data-v="suscriptores" hidden>Suscriptores</button>
  <button data-v="productos">Productos</button>
  <button data-v="equipo" hidden>Equipo</button>
</nav>
<main id="app"><div class="vacio">Cargando…</div></main>
<div id="aviso"></div>
<script>
"use strict";
const $ = s => document.querySelector(s), app = $("#app");
const E = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MODOS = {automatico:"Automático", revision:"Con revisión", manual:"Solo a mano", apagado:"Apagado"};
const POS = {premium:["Premium","tras el primer párrafo"], estandar:["Estándar","entre el tercio y la mitad"], referencia:["Referencia","al final del texto"]};
const enWeb = m => m.estado === "publicada" ? (m.en_web ? `<span class="chip pub">En la web</span>` : `<span class="chip pro">Falta en la web</span>`) : "";
const EST = {publicada:["pub","Publicada"], propuesta:["pro","Pendiente"], retirada:["ret","Retirada"]};
const puede = k => ((window._est || {}).permisos || []).includes(k);
const jefe = () => puede("redaccion");
const num = n => n == null ? "—" : Number(n).toLocaleString("es-ES");
let yo = null, vista = "piezas", filtro = "pendientes", cache = {piezas:null, productos:null, anuncios:null};

async function api(a, body, params) {
  const q = new URLSearchParams(Object.assign({a}, params || {}));
  const r = await fetch("/api/gestor?" + q, body ? {method:"POST", headers:{"Content-Type":"application/json","X-Gestor":"1"}, body:JSON.stringify(body), credentials:"same-origin"} : {credentials:"same-origin"});
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && a !== "entrar" && a !== "aceptar") { yo = null; login(); throw new Error("sin sesión"); }
  if (!r.ok) { const er = new Error(d.error || ("Error " + r.status)); er.datos = d; er.status = r.status; throw er; }
  return d;
}
function aviso(t, err) { const n = $("#aviso"); n.textContent = t; n.className = err ? "err" : ""; n.style.display = "block"; clearTimeout(aviso.t); aviso.t = setTimeout(() => n.style.display = "none", err ? 7000 : 3500); }
const chip = e => { const x = EST[e] || ["", e]; return `<span class="chip ${x[0]}">${E(x[1])}</span>`; };
const params = () => new URLSearchParams(location.search);
function volverAlSitio() { const v = params().get("volver"); return v && /^https:\/\/(www\.)?moticias\.com\//.test(v) ? v : null; }

// Markdown mínimo para la vista previa (el de la web lo pinta Ghost): párrafos, ##, **negrita**, enlaces.
function md(t) {
  const inl = s => E(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return String(t || "").split(/\n{2,}/).map(b => b.trim()).filter(Boolean).map(b => /^##\s/.test(b) ? `<h4>${inl(b.replace(/^##\s*/, ""))}</h4>` : /^>/.test(b) ? `<blockquote>${inl(b.replace(/^>+\s?/gm, ""))}</blockquote>` : `<p>${inl(b).replace(/\n/g, "<br>")}</p>`).join("");
}

function login(msg) {
  $("#nav").hidden = true; $("#quien").textContent = ""; $("#salir").hidden = true;
  app.innerHTML = `<div class="card"><h1>Entrar</h1><p class="mute">${msg || "Gestor de MOTICIAS: redacción, contenido patrocinado, publicidad, CRM y equipo."}</p>
  <form id="f"><label>Correo</label><input type="email" id="email" autocomplete="username" inputmode="email" placeholder="tu@correo">
  <label>Contraseña</label><input type="password" id="clave" autocomplete="current-password" required>
  <p><button class="b" style="width:100%">Entrar</button></p></form>
  <p class="mute">La sesión dura 90 días en este dispositivo. Si entras como editor jefe, moticias.com te enseña tus herramientas en cada noticia mientras dure la sesión. Acceso de emergencia del superadministrador: deja el correo vacío y usa la contraseña común.</p></div>`;
  $("#f").onsubmit = async ev => { ev.preventDefault(); try { await api("entrar", {email: $("#email").value.trim(), clave: $("#clave").value}); arrancar(); } catch (e) { aviso(e.message, true); } };
}

function aceptarInvitacion(inv) {
  $("#nav").hidden = true;
  app.innerHTML = `<div class="card"><h1>Bienvenido al gestor de MOTICIAS</h1><p class="mute">Crea tu contraseña. Mejor una frase larga que una contraseña rara (mínimo 10 caracteres).</p>
  <form id="f"><label>Contraseña nueva</label><input type="password" id="c1" autocomplete="new-password" required minlength="10">
  <label>Repítela</label><input type="password" id="c2" autocomplete="new-password" required minlength="10">
  <p><button class="b" style="width:100%">Crear contraseña y entrar</button></p></form></div>`;
  $("#f").onsubmit = async ev => { ev.preventDefault();
    if ($("#c1").value !== $("#c2").value) return aviso("Las dos contraseñas no coinciden", true);
    try { await api("aceptar", {invitacion: inv, clave: $("#c1").value}); history.replaceState(null, "", location.pathname); aviso("Cuenta lista. Para entrar otra vez: tu correo y esta contraseña."); arrancar(); }
    catch (e) { aviso(e.message, true); } };
}

async function arrancar() {
  const inv = params().get("invitacion");
  if (inv) return aceptarInvitacion(inv);
  let est; try { est = await api("yo"); } catch (e) { return; }
  if (!est.configurado) { app.innerHTML = `<div class="card"><h1>Falta configurar</h1><p>Añade en Vercel la variable <b>GESTOR_CLAVE_SUPERADMIN</b> y vuelve a desplegar.</p></div>`; return; }
  yo = est.rol; if (!yo) return login();
  window._est = est;
  $("#nav").hidden = false; $("#salir").hidden = false;
  $("#quien").textContent = est.nombre && !/^Acceso común/.test(est.nombre) ? est.nombre.split(" ")[0] + " · " + (jefe() ? "editor jefe" : yo) : (jefe() ? "editor jefe" : yo) + " (común)";
  $("#nav").querySelector('[data-v="suscriptores"]').hidden = !puede("suscriptores");
  $("#nav").querySelector('[data-v="equipo"]').hidden = !puede("equipo");
  $("#nav").querySelector('[data-v="crm"]').hidden = !puede("crm");
  $("#nav").querySelector('[data-v="noticia"]').hidden = !(yo === "superadmin" || yo === "editor");
  $("#nav").querySelector('[data-v="prensa"]').hidden = !puede("crm");
  const p = params().get("pieza"), acc = params().get("accion");
  if (p && jefe() && ["editar", "ia", "retirar"].includes(acc)) return abrirEditor(p, acc);
  if (p) return abrirPieza(p, true);
  if (volverAlSitio() && jefe()) { location.href = volverAlSitio(); return; }  // entró desde moticias.com#editor: vuelve con sus herramientas
  const v = params().get("vista"); if (v && $(`#nav [data-v="${v}"]`)) vista = v;
  ir(vista);
}
$("#salir").onclick = async () => { try { await api("salir", {}); } catch (e) {} yo = null; login("Sesión cerrada. En moticias.com ya no verás las herramientas del editor jefe."); };
$("#nav").onclick = ev => { const b = ev.target.closest("button"); if (b) { history.replaceState(null, "", location.pathname); ir(b.dataset.v); } };
function ir(v) { vista = v; app.className = ""; document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); ({piezas:verPiezas, noticia:verNoticia, productos:verProductos, anuncios:verAnuncios, seguimiento:verSeguimiento, crm:verCrm, prensa:verPrensa, suscriptores:verSuscriptores, equipo:verEquipo})[v](); scrollTo(0,0); }

function avisoConfig() {
  const e = window._est || {}; const f = [];
  if (!e.escritura) f.push("GITHUB_TOKEN (sin él, el gestor solo puede mirar)");
  if (!e.ghost) f.push("GHOST_ADMIN_KEY y GHOST_URL (sin ellas, los cambios se ven en la web en la próxima publicación)");
  return f.length ? `<div class="card" style="border-color:#e7c48d"><b>Configuración pendiente en Vercel</b><p class="mute">Falta: ${f.map(E).join("; ")}.</p></div>` : "";
}

// ---------- Piezas ----------
async function verPiezas() {
  app.innerHTML = `<div class="vacio">Cargando piezas…</div>`;
  try { cache.piezas = (await api("piezas", null, {dias: 30})).piezas; } catch (e) { if (e.message !== "sin sesión") app.innerHTML = `<div class="vacio">${E(e.message)}</div>`; return; }
  if (jefe()) { try { cache.firma = await api("firma"); } catch (e) { cache.firma = null; } }
  pintarPiezas();
}
function cajaFirma() {
  const f = cache.firma; if (!f || !jefe()) return "";
  const q = f.cupo, ok = q.pct <= q.max;
  return `<div class="card ${ok ? "" : "jefe"}"><div class="row" style="justify-content:space-between"><b>Tu firma</b><span class="chip ${ok ? "pub" : "ret"}">${String(q.pct).replace(".", ",")} % · tope ${q.max} %</span></div>
  <p class="mute">${q.director} de ${q.total} piezas en los últimos 30 días llevan tu nombre. Puedes firmar ${q.libres_objetivo} más sin pasar del objetivo (${q.objetivo} %). Solo las importantes; lo demás lo firma la redacción.</p></div>`;
}
function pintarPiezas() {
  const ps = cache.piezas || [];
  const grupos = {
    pendientes: ps.filter(p => p.menciones.some(m => m.estado === "propuesta") || p.status === "pendiente"),
    publicadas: ps.filter(p => p.menciones.some(m => m.estado === "publicada")),
    web: ps.filter(p => p.menciones.some(m => m.estado === "publicada" && !m.en_web)),
    candidatas: ps.filter(p => !p.menciones.some(m => m.estado !== "retirada") && p.candidatos.length && p.kind !== "analisis"),
    todas: ps
  };
  if (filtro === "pendientes" && !grupos.pendientes.length && !grupos.web.length) filtro = "todas";
  if (filtro === "pendientes" && !grupos.pendientes.length && grupos.web.length) filtro = "web";
  const nombres = {pendientes:"Pendientes", web:"Falta en la web", publicadas:"Con caja", candidatas:"Posibles", todas:"Todas"};
  const lista = grupos[filtro];
  const subir = grupos.web.length && puede("piezas") ? `<div class="card"><b>${grupos.web.length} pieza(s) con caja aprobada que aún no está en la web.</b><p><button class="b" id="subir" style="width:100%">Subir todo a la web ahora</button></p></div>` : "";
  app.innerHTML = avisoConfig() + cajaFirma() + subir + `<div class="filtros">${Object.keys(grupos).map(k => `<button data-f="${k}" class="${k===filtro?"on":""}">${nombres[k]} · ${grupos[k].length}</button>`).join("")}</div>`
    + (lista.length ? lista.map(p => {
      const act = p.menciones.filter(m => m.estado !== "retirada");
      const c = p.candidatos[0];
      const st = p.status === "retirada" ? ` <span class="chip ret">Retirada</span>` : p.status === "pendiente" ? ` <span class="chip pro">Espera tu aprobación</span>` : "";
      return `<button class="item" data-id="${E(p.id)}"><span class="mute">${E(p.date)} · ${E(p.section || "")}${p.kind === "analisis" ? " · análisis" : ""} · ${E(p.author || "")}</span>
        <div class="t">${E(p.title)}${st}</div>
        <div class="row">${act.length ? act.map(m => `${chip(m.estado)} ${enWeb(m)} <span class="mute">${E(m.nombre || m.producto)} · ${POS[m.posicion || "estandar"][0]}</span>`).join(" ") : (c ? `<span class="mute">Posible: ${E(c.nombre)} · ${c.puntuacion}/${c.umbral}</span>` : `<span class="mute">Sin coincidencias</span>`)}</div></button>`;
    }).join("") : `<div class="vacio">Nada en «${nombres[filtro]}» en los últimos 30 días.</div>`);
  const bs = $("#subir"); if (bs) bs.onclick = async () => { bs.disabled = true; bs.textContent = "Subiendo…";
    try { const d = await api("republicar_pendientes", {}); const mal = d.piezas.filter(r => !r.ok);
      aviso(mal.length ? `${d.piezas.length - mal.length} subidas; ${mal.length} con error: ${mal[0].detalle}` : `${d.piezas.length} pieza(s) actualizadas en la web`, !!mal.length); verPiezas(); }
    catch (e) { aviso(e.message, true); bs.disabled = false; } };
  app.querySelector(".filtros").onclick = ev => { const b = ev.target.closest("button"); if (b) { filtro = b.dataset.f; pintarPiezas(); } };
  app.querySelectorAll(".item").forEach(b => b.onclick = () => abrirPieza(b.dataset.id));
}

async function abrirPieza(id, desdeCorreo) {
  app.innerHTML = `<div class="vacio">Abriendo la pieza…</div>`;
  let p; try { p = await api("pieza", null, {id}); } catch (e) { if (e.message !== "sin sesión") app.innerHTML = `<div class="vacio">${E(e.message)}</div>`; return; }
  pintarPieza(p, desdeCorreo);
}
function cajaJefe(p) {
  if (!jefe()) return "";
  const ret = p.status === "retirada", pend = p.status === "pendiente";
  return `<div class="card jefe"><h2>✎ Editor jefe</h2>
  ${ret ? `<div class="warn">Retirada: no se ve en moticias.com. Se conserva entera y se puede restaurar.</div>` : ""}
  ${pend ? `<div class="warn">Espera tu aprobación: está en borrador en Ghost.</div>` : ""}
  <div class="row"><button class="b" data-ed="editar">Editar</button><button class="b2" data-ed="ia">Otro enfoque con IA</button>
  ${pend ? `<button class="b2" data-ed="publicar">Aprobar y publicar</button>` : ""}
  ${ret ? `<button class="b2" data-ed="restaurar">Restaurar</button>` : `<button class="b2 bad" data-ed="retirar">Retirar</button>`}</div>
  <p class="mute" style="margin-bottom:0">Editar y la IA te enseñan el resultado antes de publicar. Retirar la quita de la web sin borrarla.</p></div>`;
}
function pintarPieza(p, desdeCorreo) {
  const act = p.menciones.filter(m => m.estado !== "retirada"), ret = p.menciones.filter(m => m.estado === "retirada");
  const usados = new Set(act.map(m => m.producto));
  const cands = (p.candidatos || []).filter(c => !usados.has(c.producto) && c.modo !== "apagado");
  const pub = puede("piezas"), prop = puede("proponer");
  const vuelta = volverAlSitio();
  app.innerHTML = `<p class="row"><button class="b2" id="volver">← ${desdeCorreo ? "Todas las piezas" : "Volver"}</button>${vuelta ? `<a class="b2" href="${E(vuelta)}">Volver a moticias.com</a>` : ""}</p>
  <div class="card"><span class="mute">${E(p.date)} · ${E(p.section || "")} · ${E(p.author || "")}</span><h1>${E(p.title)}</h1>
  <a href="${E(p.url)}" target="_blank" rel="noopener" class="mute">Ver en moticias.com ↗</a></div>
  ${cajaJefe(p)}

const enlace = u => u ? `<a href="${E(u)}" target="_blank" rel="noopener">${E(u.replace(/^https?:\/\/(www\.)?/, "").slice(0, 60))}</a>` : "";

  + `<div class="card"><h1>Equipo</h1><p class="mute">Cada persona entra con su correo y su contraseña. La das de alta aquí y le mandas el enlace: con él crea su contraseña. Nunca se borra a nadie: se suspende. Solo el editor jefe publica; los demás proponen.</p>
    <form id="nueva"><label>Nombre</label><input id="nn" required maxlength="80"><label>Correo</label><input id="ne" type="email" required inputmode="email">
    <label>Perfil</label><select id="np">${Object.keys(PERF).map(k => `<option value="${k}" ${k==="editor"?"selected":""}>${PERF[k]} — ${PERF_TXT[k]}</option>`).join("")}</select>
    <p><button class="b" style="width:100%">Dar de alta y crear enlace</button></p></form><div id="enlace"></div></div>`
  + (d.personas.length ? d.personas.map(p => `<div class="card" data-id="${E(p.id)}"><div class="row" style="justify-content:space-between"><h2>${E(p.nombre)}</h2><span class="chip ${(ESTP[p.estado]||[""])[0]}">${E((ESTP[p.estado]||["",p.estado])[1])}</span></div>
      <p class="mute">${E(p.email)}${p.ultimo_acceso ? " · último acceso " + E(p.ultimo_acceso.slice(0,10)) : ""}${p.estado==="invitada" && p.invitacion_expira ? " · el enlace caduca el " + E(p.invitacion_expira.slice(0,10)) : ""}</p>
      <label>Perfil</label>${sel(p.id, p.perfil)}
      <div class="row" style="margin-top:10px">${p.estado==="suspendida" ? `<button class="b2" data-acc="reactivar">Reactivar</button>` : `<button class="b2 bad" data-acc="suspender">Suspender</button>`}
      <button class="b2" data-acc="nuevo_enlace">${p.estado==="invitada" ? "Nuevo enlace de invitación" : "Enlace para cambiar la contraseña"}</button></div><div class="enl"></div></div>`).join("")
    : `<div class="vacio">Todavía no hay nadie. Empieza por darte de alta tú mismo como editor jefe.</div>`)
  + `<div class="card mute"><b>Perfiles</b><br>${Object.keys(PERF).map(k => `<b>${PERF[k]}</b>: ${PERF_TXT[k]}`).join("<br>")}</div>`;
  const mostrar = (box, enlace, p) => {
    const txt = `Hola ${p.nombre.split(" ")[0]}: te doy acceso al gestor de MOTICIAS. Crea tu contraseña aquí (el enlace vale 7 días y solo una vez): ${enlace}`;
    box.innerHTML = `<div class="caja"><p class="et">Enlace para ${E(p.nombre)}</p><input readonly value="${E(enlace)}" onclick="this.select()">
      <div class="row" style="margin-top:8px"><button class="b2" data-copiar>Copiar</button>
      <a class="b2" style="text-decoration:none" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="b2" style="text-decoration:none" href="mailto:${encodeURIComponent(p.email)}?subject=${encodeURIComponent("Acceso al gestor de MOTICIAS")}&body=${encodeURIComponent(txt)}">Correo</a></div>
      <p class="mute" style="margin:8px 0 0">Mándaselo tú: no se guarda en ningún sitio y no se puede volver a ver.</p></div>`;
    box.querySelector("[data-copiar]").onclick = async () => { try { await navigator.clipboard.writeText(enlace); aviso("Enlace copiado"); } catch (e) { box.querySelector("input").select(); } };
  };
  $("#nueva").onsubmit = async ev => { ev.preventDefault(); const b = ev.target.querySelector("button"); b.disabled = true;
    try { const r = await api("equipo", {accion:"invitar", nombre:$("#nn").value, email:$("#ne").value, perfil:$("#np").value});
      await verEquipo(); mostrar($("#enlace"), r.enlace, r.persona); $("#enlace").scrollIntoView({behavior:"smooth"}); }
    catch (e) { aviso(e.message, true); b.disabled = false; } };
  app.querySelectorAll("[data-perfil]").forEach(s => s.onchange = async () => {
    try { await api("equipo", {accion:"perfil", id:s.dataset.perfil, perfil:s.value}); aviso("Perfil cambiado"); } catch (e) { aviso(e.message, true); verEquipo(); } });
  app.querySelectorAll("[data-id] [data-acc]").forEach(b => b.onclick = async () => {
    const c = b.closest("[data-id]"); b.disabled = true;
    try { const r = await api("equipo", {accion:b.dataset.acc, id:c.dataset.id});
      if (r.enlace) { mostrar(c.querySelector(".enl"), r.enlace, r.persona); b.disabled = false; } else { aviso("Hecho"); verEquipo(); } }
    catch (e) { aviso(e.message, true); b.disabled = false; } });
}

// ---------- Seguimiento de publicidad, patrocinios y contenido patrocinado ----------
const fh = t => t ? String(t).replace("T", " ").slice(0, 16) : "—";
const pct = (c, i) => i ? (100 * c / i).toLocaleString("es-ES", {maximumFractionDigits: 2}) + " %" : "—";
async function verSeguimiento(dias) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === "anuncios"));
  app.innerHTML = `<div class="vacio">Cargando el seguimiento…</div>`;
  let d; try { d = await api("seguimiento", null, {dias: dias || 30}); } catch (e) { if (e.message !== "sin sesión") app.innerHTML = `<div class="card">${E(e.message)}</div>`; return; }
  const vivas = d.cajas.filter(c => c.estado === "activo" || (c.cifras && c.cifras.impresiones) || (c.piezas || []).length);
  const resto = d.cajas.filter(c => !vivas.includes(c));
  const tot = vivas.reduce((t, c) => [t[0] + ((c.cifras||{}).impresiones||0), t[1] + ((c.cifras||{}).clics||0)], [0, 0]);
  const tabla = (o, n) => Object.entries(o || {}).sort((a, b) => b[1][0] - a[1][0]).slice(0, n).map(([k, v]) => `<div class="paso"><span>${E(k)}</span><span class="mute">${num(v[0])} vistas · ${num(v[1])} clics</span></div>`).join("") || `<p class="mute">Sin datos.</p>`;
  const caja = c => { const x = c.cifras || {}, comp = c.comprobaciones || [], u = comp[0];
    return `<div class="card" data-c="${E(c.id)}"><div class="row" style="justify-content:space-between"><h2>${E(c.nombre)}</h2><span class="chip ${c.estado==="activo"?"pub":""}">${E(c.estado || "")}</span></div>
    <p class="mute">${E(c.anunciante || "")} · ${E(c.tipo || "")}${c.nivel ? " · " + E(c.nivel) : ""}<br>Publicada: ${fh(c.publicada)} · Retirada: ${fh(c.retirada)}${c.inicio || c.fin ? `<br>Programada: ${E(c.inicio || "")} → ${E(c.fin || "")}` : ""}</p>
    <div class="kpi"><div><b>${num(x.impresiones || 0)}</b><span class="mute">vistas</span></div><div><b>${num(x.clics || 0)}</b><span class="mute">clics</span></div><div><b>${pct(x.clics || 0, x.impresiones || 0)}</b><span class="mute">CTR</span></div></div>
    <p class="mute" style="margin-top:8px">${u ? `Comprobador: ${u.ok ? "✓ funciona" : "✗ " + E(u.error || "falla")} · ${fh(u.at)} · ${u.estado || "—"} · ${u.ms} ms${u.origen === "manual" ? " · a mano" : ""}` : "Comprobador: todavía sin pasar."}</p>
    <details><summary>Posiciones (${(c.huecos || []).length})</summary><p class="mute">Configuradas: ${E((c.huecos || []).join(", ") || "—")}</p>${tabla(x.huecos, 10)}</details>
    <details><summary>Dónde se vio (contextos)</summary>${tabla(x.paginas, 15)}</details>
    ${(c.piezas || []).length ? `<details><summary>Piezas con esta caja (${c.piezas.length})</summary>${c.piezas.map(p => `<div class="paso"><div>${E(p.titulo)}<br><span class="mute">${E(p.posicion)} · ${E(p.estado)} · publicada ${fh(p.publicada)}${p.retirada ? " · retirada " + fh(p.retirada) : ""}</span></div></div>`).join("")}</details>` : ""}
    ${comp.length > 1 ? `<details><summary>Últimas comprobaciones</summary>${comp.map(k => `<div class="paso"><span>${k.ok ? "✓" : "✗"} ${fh(k.at)} · ${k.estado || "—"} · ${k.ms} ms</span><span class="mute">${E(k.origen)}${k.error ? " · " + E(k.error) : ""}</span></div>`).join("")}</details>` : ""}
    ${puede("publicidad") && c.url ? `<p><button class="b2" data-comp="${E(c.id)}">Comprobar ahora</button></p>` : ""}</div>`; };
  app.innerHTML = `<p class="row"><button class="b2" id="volver">← Publicidad</button></p>
    <div class="card"><h1>Seguimiento</h1><p class="mute">Últimos ${d.dias} días. Vistas: la caja se vio al menos a medias en pantalla. Clics: un lector pulsó su enlace. No cuentan ni los robots, ni tus propias visitas como editor jefe, ni el comprobador, que visita cada enlace a horas al azar de los laborables para confirmar que el destino responde.</p>
    <div class="kpi"><div><b>${num(tot[0])}</b><span class="mute">vistas</span></div><div><b>${num(tot[1])}</b><span class="mute">clics</span></div><div><b>${pct(tot[1], tot[0])}</b><span class="mute">CTR</span></div></div>
    <div class="filtros" style="margin-top:10px">${[7, 30, 90].map(n => `<button data-d="${n}" class="${n===d.dias?"on":""}">${n} días</button>`).join("")}</div>
    ${puede("publicidad") ? `<button class="b2" id="todas">Comprobar todos los enlaces ahora</button>` : ""}</div>
    ${vivas.map(caja).join("")}${resto.length ? `<details class="card"><summary>Sin actividad (${resto.length})</summary>${resto.map(caja).join("")}</details>` : ""}`;
  $("#volver").onclick = () => ir("anuncios");
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => verSeguimiento(+b.dataset.d));
  const comprobar = async (b, anuncio) => { b.disabled = true; b.innerHTML = `<span class="spin"></span>Comprobando…`;
    try { const r = await api("comprobar", anuncio ? {anuncio} : {}); const mal = r.resultados.filter(x => !x.ok);
      aviso(mal.length ? `${mal.length} enlace(s) fallan: ${mal.map(x => x.nombre).join(", ")}` : `${r.resultados.length} enlace(s) funcionan`, !!mal.length); verSeguimiento(d.dias); }
    catch (e) { aviso(e.message, true); b.disabled = false; } };
  const t = $("#todas"); if (t) t.onclick = () => comprobar(t);
  app.querySelectorAll("[data-comp]").forEach(b => b.onclick = () => comprobar(b, b.dataset.comp));
}

// ---------- Nueva noticia desde el gestor (editor y editor jefe) ----------
async function verNoticia() {
  app.innerHTML = `<div class="vacio">Cargando…</div>`;
  let d = {encargos: [], dominios: [], clases: {}}; try { d = await api("encargos"); } catch (e) { if (e.message === "sin sesión") return; }
  const EST_E = {pendiente: ["pro", "En cola"], en_curso: ["pro", "La redacción está en ello"], publicada: ["pub", "Publicada"], pendiente_aprobacion: ["pro", "Espera al editor jefe"], sin_fuentes: ["ret", "Sin fuente primaria: no se publicó"], descartado: ["", "Descartada"]};
  app.innerHTML = `<div class="card jefe"><h1>Nueva noticia</h1>
    <p class="mute">Pega un texto (una nota de prensa, un aviso, una idea) o un enlace, o las dos cosas. La redacción lo investiga con el método de siempre —fuente primaria, verificación, reportaje completo— y escribe la pieza. Sin fuente primaria no se publica.</p>
    <label>Texto o enlace</label><textarea id="nt" style="min-height:220px" placeholder="Pega aquí el texto o el enlace (https://…)"></textarea>
    <label>Qué hacer</label>
    <label class="chk"><input type="radio" name="op" value="1" checked> <span><b>1. Investiga y crea la noticia</b> con publicación hoy mismo${jefe() ? "" : " (como editor, queda escrita para que el editor jefe la apruebe)"}.</span></label>
    <label class="chk"><input type="radio" name="op" value="2"> <span><b>2. Igual que 1 y registra el dominio de la fuente</b> (todas sus noticias, no solo esta) como:</span></label>
    <div id="clases" hidden style="margin-left:26px">${Object.entries(d.clases || {}).map(([k, t]) => `<label class="chk"><input type="radio" name="cl" value="${k}"> <span>${E(t)}</span></label>`).join("")}
      <p class="mute">«No de confianza»: lo que venga de ese dominio se revisa siempre y pasa a la cola del editor jefe antes de publicarse.${jefe() ? "" : " Lo que registres tú queda sin confirmar (y se trata como no de confianza) hasta que lo vea el editor jefe."}</p></div>
    <p><button class="b" id="enviar" style="width:100%">Encargar a la redacción</button></p>
    <p class="mute">La rutina de la redacción pasa cada hora en laborables, de 8 a 21. Lo que pegues se guarda en la base privada, no en el repositorio.</p></div>
    <div class="card"><h2>Encargos recientes</h2>${(d.encargos || []).map(e => { const x = EST_E[e.estado] || ["", e.estado];
      return `<div class="paso"><div><span class="mute">${fh(e.creado_at)} · ${E(e.pedido_por)}${e.dominio ? " · " + E(e.dominio) : ""}</span><br>${E(e.texto)}${e.pieza ? `<br><a href="https://www.moticias.com/${E(e.pieza)}/" target="_blank" rel="noopener">Ver la pieza ↗</a>` : ""}${e.resultado ? `<br><span class="mute">${E(e.resultado)}</span>` : ""}</div><span class="chip ${x[0]}">${E(x[1])}</span></div>`; }).join("") || `<p class="mute">Ninguno todavía.</p>`}</div>
    <details class="card"><summary>Fuentes registradas por dominio (${(d.dominios || []).length})</summary>${(d.dominios || []).map(x => `<div class="paso"><div><b>${E(x.dominio)}</b><br><span class="mute">${E((d.clases || {})[x.clase] || x.clase)}${x.confirmado ? "" : " · sin confirmar"} · ${E(x.por || "")}</span></div>
      ${jefe() ? `<select data-dom="${E(x.dominio)}">${Object.entries(d.clases || {}).map(([k, t]) => `<option value="${k}" ${k===x.clase?"selected":""}>${E(t.split(" (")[0])}</option>`).join("")}</select>${x.confirmado ? "" : `<button class="b2" data-conf="${E(x.dominio)}" data-cl="${E(x.clase)}">Confirmar</button>`}` : ""}</div>`).join("") || `<p class="mute">Ninguna.</p>`}</details>`;
  app.querySelectorAll('input[name="op"]').forEach(r => r.onchange = () => { $("#clases").hidden = app.querySelector('input[name="op"]:checked').value !== "2"; });
  $("#enviar").onclick = async ev => {
    const texto = $("#nt").value.trim(), op = +app.querySelector('input[name="op"]:checked').value, cl = app.querySelector('input[name="cl"]:checked');
    if (texto.length < 10) return aviso("Pega un texto o un enlace", true);
    if (op === 2 && !cl) return aviso("Elige cómo registrar la fuente", true);
    ev.target.disabled = true;
    try { const r = await api("encargo", {texto, opcion: op, clase_fuente: cl ? cl.value : null}); aviso(r.aviso + (r.fuente ? " · " + r.fuente : "")); verNoticia(); }
    catch (e) { aviso(e.message, true); ev.target.disabled = false; }
  };
  const dom = async (dominio, clase) => { try { const r = await api("dominio", {dominio, clase}); aviso(r.detalle); verNoticia(); } catch (e) { aviso(e.message, true); } };
  app.querySelectorAll("[data-dom]").forEach(s => s.onchange = () => dom(s.dataset.dom, s.value));
  app.querySelectorAll("[data-conf]").forEach(b => b.onclick = () => dom(b.dataset.conf, b.dataset.cl));
}
arrancar();
</script>
</body>
</html>
