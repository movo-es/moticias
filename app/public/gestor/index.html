<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Gestor · MOTICIAS</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#141414;--mute:#6b6f6c;--line:#e3e4e1;--acc:#1c6b4a;--warn:#a15c00;--bad:#a12b2b;--soft:#f4f6f5}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:12px 16px calc(10px);display:flex;align-items:center;gap:10px}
header b{font-size:17px;letter-spacing:.02em;white-space:nowrap}header small{opacity:.65;margin-left:auto;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{position:sticky;top:46px;z-index:4;display:flex;background:#111;padding:0 8px 8px;gap:6px;overflow-x:auto}
nav button{flex:1;min-width:max-content;background:#2a2a2a;color:#ddd;border:0;border-radius:18px;padding:8px 12px;font-size:14px}
nav button.on{background:#fff;color:#111;font-weight:600}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute);font-size:13px}
h1{font-size:20px;margin:4px 0 8px}h2{font-size:16px;margin:0 0 6px}
.chip{display:inline-block;font-size:12px;border-radius:10px;padding:2px 8px;background:#eee;color:#333}
.chip.pub{background:#e3f1ea;color:var(--acc)}.chip.pro{background:#fff1dd;color:var(--warn)}.chip.ret{background:#f3e3e3;color:var(--bad)}
button.b{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;padding:10px 14px;font-size:15px;min-height:44px}
button.b2{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font-size:15px;min-height:44px}
button.bad{border-color:var(--bad);background:#fff;color:var(--bad)}
button:disabled{opacity:.5}
a.b2,a.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:9px;text-decoration:none}a.b2{border:1px solid var(--line);background:#fff;color:var(--ink)}a.b{background:var(--ink);color:#fff}
.filtros{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px}
.filtros button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}
.filtros button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;font:inherit;color:inherit}
.item .t{font-weight:600;line-height:1.3;margin:2px 0 6px}
.caja{background:var(--soft);border-left:3px solid #c9d2cd;border-radius:6px;padding:12px;margin:10px 0}
.caja .et{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7a837e;margin:0 0 6px}
textarea,input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:110px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-size:14px;min-height:44px}
.seg button.on{background:var(--ink);color:#fff}
.vista{font-family:Georgia,serif;font-size:15px;line-height:1.55;max-height:60vh;overflow:auto;border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.vista aside{outline:2px dashed var(--acc);outline-offset:3px}
#aviso{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;background:#111;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;display:none}
#aviso.err{background:var(--bad)}
.vacio{text-align:center;color:var(--mute);padding:30px 10px}
details summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 0}
.cand{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.cand:first-child{border-top:0}
.barra{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px}.barra i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;margin:0 0 10px;overflow-x:auto}.tabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.jefe{border-color:#111}.jefe h2{display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:900px){main.ancho{max-width:1180px}.grid2{grid-template-columns:1fr 1fr}}
.prev{font-family:Georgia,serif;font-size:15px;line-height:1.55;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fffdf8}
.prev h3{font-family:inherit;font-size:20px;margin:0 0 6px}.prev .sub{color:#555;margin:0 0 10px}
.marca{background:#fff1c2;padding:0 2px;border-radius:3px}
.warn{background:#fff6e6;border:1px solid #e7c48d;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.okbox{background:#eef6f1;border:1px solid #bcd9c8;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}.chk input{width:auto;margin-top:3px}
.ad-prev{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.ad-prev .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7a837e}
.ad-prev b{display:block;margin:4px 0}.ad-prev u{color:var(--acc)}
.kpi{display:flex;gap:16px;flex-wrap:wrap}.kpi div b{font-size:22px;display:block}
.paso{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}.paso:first-child{border-top:0}
.venc{color:var(--bad);font-weight:600}.hoy{color:var(--warn);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#111;border-radius:50%;animation:g 1s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes g{to{transform:rotate(360deg)}}
/* Cola del editor (cambio cola-del-editor, 16-11-2026) */
.q-herr{display:flex;gap:8px;align-items:center;margin:0 0 10px}.q-herr select{flex:1;min-width:0}
.q-act{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.q-act button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:14px;padding:3px 10px;font-size:13px}.q-act button::after{content:" ×";opacity:.7}
.q-it{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}.q-it.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.q-cab{display:flex;gap:10px;padding:12px 14px 10px}.q-cab input[type=checkbox]{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--acc)}.q-cu{min-width:0;flex:1}
.q-l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.q-imp{display:inline-flex;gap:2px;align-items:center}.q-imp i{width:7px;height:14px;border-radius:2px;background:#d7dad6;display:block}.q-imp i.on{background:var(--ink)}.q-imp b{font-size:12px;color:var(--ink);margin-left:3px}
.q-t{font-weight:600;line-height:1.3;margin:6px 0}
.q-et{display:flex;gap:5px;flex-wrap:wrap}.q-e{font-size:12px;border-radius:10px;padding:2px 8px;background:var(--soft);color:var(--ink)}
.q-e.fp{background:#e3f1ea;color:var(--acc)}.q-e.fs{background:#fff1dd;color:var(--warn)}.q-e.fn{background:#f6e4e4;color:var(--bad)}.q-e.sol{border:1px dashed var(--mute);background:transparent}.q-e.est{font-weight:600}
.q-pronto{color:var(--bad);font-weight:600}
.q-grupo{font-size:13px;color:var(--acc);background:none;border:0;padding:6px 0 0;text-align:left}
.q-av{margin:6px 0 0;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:13px;display:grid;gap:4px}.q-av a{color:var(--acc);word-break:break-all}
.q-acc{display:flex;gap:6px;overflow-x:auto;padding:0 14px 12px}.q-acc button{flex:none;white-space:nowrap;min-height:40px;padding:8px 12px;font-size:14px}
.q-motivo{font-size:12px;color:var(--bad);padding:0 14px 10px;margin-top:-4px}
.q-bloque{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;overflow-x:auto}
.q-bloque b{white-space:nowrap;font-size:14px}.q-bloque button{flex:none;white-space:nowrap;min-height:40px;padding:8px 12px;font-size:14px}
.q-velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.q-hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:16px 16px 0 0;max-height:86vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.q-ops{display:flex;flex-wrap:wrap;gap:6px}.q-op{border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 11px;font-size:14px}.q-op.on{background:var(--ink);color:#fff;border-color:var(--ink)}.q-op:disabled{opacity:.45}
.q-pie{display:flex;gap:8px;margin-top:16px}.q-pie button{flex:1}
body.q-con-bloque{padding-bottom:80px}
</style>
</head>
<body>
<header><b>MOTICIAS · Gestor</b><small id="quien"></small><button id="salir" hidden style="margin-left:8px;background:none;border:1px solid #555;color:#ddd;border-radius:14px;padding:4px 10px;font-size:12px">Salir</button></header>
<nav id="nav" hidden>
  <button data-v="inicio">Inicio</button>
  <button data-v="cola" hidden>Cola</button>
  <button data-v="piezas" class="on">Piezas</button>
  <button data-v="noticia" hidden>Nueva noticia</button>
  <button data-v="agenda" hidden>Agenda</button>
  <button data-v="anuncios">Publicidad</button>
  <button data-v="crm" hidden>CRM</button>
  <button data-v="prensa" hidden>Prensa</button>
  <button data-v="suscriptores" hidden>Suscriptores</button>
  <button data-v="productos">Productos</button>
  <button data-v="equipo" hidden>Equipo</button>
  <button data-v="restaurar" hidden>Restaurar</button>
  <button data-v="seo" hidden>SEO</button>
</nav>
<main id="app"><div class="vacio">Cargando…</div></main>
<div id="aviso"></div>
<script>
"use strict";
const $ = s => document.querySelector(s), app = $("#app");
const E = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MODOS = {automatico:"Automático", revision:"Con revisión", manual:"Solo a mano", apagado:"Apagado"};
const POS = {premium:["Premium","tras el primer párrafo"], estandar:["Estándar","entre el tercio y la mitad"], referencia:["Referencia","al final del texto"]};
const enWeb = m => m.estado === "publicada" ? (m.en_web ? `<span class="chip pub">En la web</span>` : `<span class="chip pro">Falta en la web</span>`) : "";
const EST = {publicada:["pub","Publicada"], propuesta:["pro","Pendiente"], retirada:["ret","Retirada"]};
const puede = k => ((window._est || {}).permisos || []).includes(k);
const jefe = () => puede("redaccion");
const num = n => n == null ? "—" : Number(n).toLocaleString("es-ES");
let yo = null, vista = "piezas", filtro = "pendientes", cache = {piezas:null, productos:null, anuncios:null};

async function api(a, body, params) {
  const q = new URLSearchParams(Object.assign({a}, params || {}));
  const r = await fetch("/api/gestor?" + q, body ? {method:"POST", headers:{"Content-Type":"application/json","X-Gestor":"1"}, body:JSON.stringify(body), credentials:"same-origin"} : {credentials:"same-origin"});
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && a !== "entrar" && a !== "aceptar") { yo = null; login(); throw new Error("sin sesión"); }
  if (!r.ok) { const er = new Error(d.error || ("Error " + r.status)); er.datos = d; er.status = r.status; throw er; }
  return d;
}
function aviso(t, err) { const n = $("#aviso"); n.textContent = t; n.className = err ? "err" : ""; n.style.display = "block"; clearTimeout(aviso.t); aviso.t = setTimeout(() => n.style.display = "none", err ? 7000 : 3500); }
const chip = e => { const x = EST[e] || ["", e]; return `<span class="chip ${x[0]}">${E(x[1])}</span>`; };
const params = () => new URLSearchParams(location.search);
function volverAlSitio() { const v = params().get("volver"); return v && /^https:\/\/(www\.)?moticias\.com\//.test(v) ? v : null; }

// Markdown mínimo para la vista previa (el de la web lo pinta Ghost): párrafos, ##, **negrita**, enlaces.
function md(t) {
  const inl = s => E(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return String(t || "").split(/\n{2,}/).map(b => b.trim()).filter(Boolean).map(b => /^##\s/.test(b) ? `<h4>${inl(b.replace(/^##\s*/, ""))}</h4>` : /^>/.test(b) ? `<blockquote>${inl(b.replace(/^>+\s?/gm, ""))}</blockquote>` : `<p>${inl(b).replace(/\n/g, "<br>")}</p>`).join("");
}

function login(msg) {
  $("#nav").hidden = true; $("#quien").textContent = ""; $("#salir").hidden = true;
  app.innerHTML = `<div class="card"><h1>Entrar</h1><p class="mute">${msg || "Gestor de MOTICIAS: redacción, contenido patrocinado, publicidad, CRM y equipo."}</p>
  <form id="f"><label>Correo</label><input type="email" id="email" autocomplete="username" inputmode="email" placeholder="tu@correo">
  <label>Contraseña</label><input type="password" id="clave" autocomplete="current-password" required>
  <p><button class="b" style="width:100%">Entrar</button></p></form>
  <p class="mute">La sesión dura 90 días en este dispositivo. Si entras como editor jefe, moticias.com te enseña tus herramientas en cada noticia mientras dure la sesión. Acceso de emergencia del superadministrador: deja el correo vacío y usa la contraseña común.</p></div>`;
  $("#f").onsubmit = async ev => { ev.preventDefault(); try { await api("entrar", {email: $("#email").value.trim(), clave: $("#clave").value}); arrancar(); } catch (e) { aviso(e.message, true); } };
}

function aceptarInvitacion(inv) {
  $("#nav").hidden = true;
  app.innerHTML = `<div class="card"><h1>Bienvenido al gestor de MOTICIAS</h1><p class="mute">Crea tu contraseña. Mejor una frase larga que una contraseña rara (mínimo 10 caracteres).</p>
  <form id="f"><label>Contraseña nueva</label><input type="password" id="c1" autocomplete="new-password" required minlength="10">
  <label>Repítela</label><input type="password" id="c2" autocomplete="new-password" required minlength="10">
  <p><button class="b" style="width:100%">Crear contraseña y entrar</button></p></form></div>`;
  $("#f").onsubmit = async ev => { ev.preventDefault();
    if ($("#c1").value !== $("#c2").value) return aviso("Las dos contraseñas no coinciden", true);
    try { await api("aceptar", {invitacion: inv, clave: $("#c1").value}); history.replaceState(null, "", location.pathname); aviso("Cuenta lista. Para entrar otra vez: tu correo y esta contraseña."); arrancar(); }
    catch (e) { aviso(e.message, true); } };
}

async function arrancar() {
  const inv = params().get("invitacion");
  if (inv) return aceptarInvitacion(inv);
  let est; try { est = await api("yo"); } catch (e) { return; }
  if (!est.configurado) { app.innerHTML = `<div class="card"><h1>Falta configurar</h1><p>Añade en Vercel la variable <b>GESTOR_CLAVE_SUPERADMIN</b> y vuelve a desplegar.</p></div>`; return; }
  yo = est.rol; if (!yo) return login();
  window._est = est;
  $("#nav").hidden = false; $("#salir").hidden = false;
  $("#quien").textContent = est.nombre && !/^Acceso común/.test(est.nombre) ? est.nombre.split(" ")[0] + " · " + (jefe() ? "editor jefe" : yo) : (jefe() ? "editor jefe" : yo) + " (común)";
  $("#nav").querySelector('[data-v="suscriptores"]').hidden = !puede("suscriptores");
  $("#nav").querySelector('[data-v="equipo"]').hidden = !puede("equipo");
  $("#nav").querySelector('[data-v="restaurar"]').hidden = !puede("restaurar");
  $("#nav").querySelector('[data-v="seo"]').hidden = !puede("equipo");
  $("#nav").querySelector('[data-v="crm"]').hidden = !puede("crm");
  $("#nav").querySelector('[data-v="noticia"]').hidden = !(yo === "superadmin" || yo === "editor");
  $("#nav").querySelector('[data-v="prensa"]').hidden = !puede("crm");
  $("#nav").querySelector('[data-v="cola"]').hidden = !["superadmin", "editor", "comercial"].includes(yo);
  $("#nav").querySelector('[data-v="agenda"]').hidden = !(puede("proponer") || puede("piezas"));
  if (["superadmin", "editor"].includes(yo) && !params().get("vista")) vista = "cola";  // la cola es la portada del gestor para quien redacta
  if (params().get("evento") && (puede("proponer") || puede("piezas"))) { vista = "agenda"; document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === "agenda")); return agAbrirEvento(params().get("evento"), params().get("accion")); }  // ✎ de una cita en moticias.com/agenda/
  if (params().get("agenda_envio")) { vista = "agenda"; document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === "agenda")); return agAbrirEnvio(params().get("agenda_envio")); }  // enlace del aviso «evento propuesto»
  const p = params().get("pieza"), acc = params().get("accion");
  if (p && jefe() && ["editar", "ia", "retirar"].includes(acc)) return abrirEditor(p, acc);
  if (p) return abrirPieza(p, true);
  if (volverAlSitio() && jefe()) { location.href = volverAlSitio(); return; }  // entró desde moticias.com#editor: vuelve con sus herramientas
  const v = params().get("vista"); if (v && $(`#nav [data-v="${v}"]`)) vista = v;
  const en = params().get("envio"); if (en && puede("crm")) { vista = "prensa"; document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === "prensa")); return verEnvio(en); }  // enlace del aviso de la sala de prensa
  if (params().get("barrido")) { vista = "piezas"; window._irBarrido = true; }  // desde el menú ✎ de moticias.com
  ir(vista);
}
$("#salir").onclick = async () => { try { await api("salir", {}); } catch (e) {} yo = null; login("Sesión cerrada. En moticias.com ya no verás las herramientas del editor jefe."); };
$("#nav").onclick = ev => { const b = ev.target.closest("button"); if (b) { history.replaceState(null, "", location.pathname); ir(b.dataset.v); } };
function ir(v) { vista = v; app.className = ""; const qb = $("#q-bloque"); if (qb) qb.remove(); document.body.classList.remove("q-con-bloque"); document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v)); ({inicio:verInicio, agenda:verAgenda, cola:verCola, seo:verSeo, piezas:verPiezas, noticia:verNoticia, productos:verProductos, anuncios:verAnuncios, seguimiento:verSeguimiento, crm:verCrm, prensa:verPrensa, suscriptores:verSuscriptores, equipo:verEquipo, restaurar:verRestaurar})[v](); scrollTo(0,0); }

function avisoConfig() {
  const e = window._est || {}; const f = [];
  if (!e.escritura) f.push("GITHUB_TOKEN (sin él, el gestor solo puede mirar)");
  if (!e.ghost) f.push("GHOST_ADMIN_KEY y GHOST_URL (sin ellas, los cambios se ven en la web en la próxima publicación)");
  if (puede("barrido") && !e.barrido) f.push("RUTINA_BARRIDO_TOKEN (sin él, el botón «Iniciar barrido de noticias ahora» no puede lanzar la tarea)");
  return f.length ? `<div class="card" style="border-color:#e7c48d"><b>Configuración pendiente en Vercel</b><p class="mute">Falta: ${f.map(E).join("; ")}.</p></div>` : "";
}


// ---------- Cola del editor (cambio cola-del-editor, decisiones de Rainer del 15 y 16-11-2026) ----------
// Temas nuevos: filtrar y ordenar por todas las etiquetas comunes; selección individual o en bloque; solo el editor jefe confirma.
const Q = {pestana:"cola", orden:"imp", sel:new Set(), selModo:false, filtros:{}, abiertos:new Set(), datos:null};
const Q_EST = {nuevo:"Nuevo", propuesto:"Propuesto por un editor", sin_fuente:"Sin fuente primaria", confirmado:"Confirmado", en_redaccion:"En redacción",
  para_aprobar:"Para aprobar", publicado:"Publicado", archivado:"Archivado", papelera:"En la papelera"};
const Q_FIA = {primaria:"Primaria", secundaria:"Secundaria reputada", sin_confirmar:"Sin confirmar"};
const Q_CAD = {hoy:"Caduca hoy o mañana", semana:"Esta semana", mas:"Más adelante", no:"No caduca"};
function qCad(t){ if (t.dias == null) return {t:"No caduca", k:"no"}; const d = t.dias;

async function restContenido(q) {

function copiasCard(c) {

  const kb = n => n == null ? "—" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";
  const cuando = (f, d) => f ? `${E(f.fin.slice(0, 16).replace("T", " "))} (hace ${E(String(d))} días)` : "todavía ninguna";
  const mal = c.dias_sin_copia == null || c.dias_sin_copia > c.umbral_dias, malp = c.dias_sin_prueba == null || c.dias_sin_prueba > c.umbral_prueba_dias;
  const u = c.ultima_copia, pt = (u && u.partes) || {};
  return `<div class="card" style="${mal || malp ? "border-color:#e7c48d" : ""}"><h1>Copias de seguridad</h1>
    <p class="mute">El Mac guarda cada día una copia del repositorio, de la base privada y de Ghost (cifradas las dos últimas). Es solo un respaldo: la web no depende de él.</p>
    <p><b>Última copia:</b> ${cuando(u, c.dias_sin_copia)}${u && u.equipo ? " · " + E(u.equipo) : ""}<br>
    <b>Última copia probada (restaurada):</b> ${cuando(c.ultima_prueba, c.dias_sin_prueba)}</p>
    ${u ? `<p class="mute">Repositorio ${kb((pt.repo||{}).bytes)} · base privada ${kb((pt.base||{}).bytes)} · Ghost ${kb((pt.ghost||{}).bytes)}${(pt.ghost||{}).miembros != null ? " (" + E(String(pt.ghost.miembros)) + " miembros)" : ""}</p>` : ""}
    ${c.ultimo_intento && !c.ultimo_intento.ok ? `<p style="color:#a12b2b">El último intento falló: ${E(c.ultimo_intento.error || "sin detalle")}</p>` : ""}
    ${mal ? `<p style="color:#8a5a00">Más de ${E(String(c.umbral_dias))} días sin copia: enciende el Mac y déjalo despierto un rato.</p>` : ""}</div>`;
}

    catch (e) { aviso(e.message, true); b.disabled = false; } });

// ---------- Seguimiento de publicidad, patrocinios y contenido patrocinado ----------
const fh = t => t ? String(t).replace("T", " ").slice(0, 16) : "—";
const pct = (c, i) => i ? (100 * c / i).toLocaleString("es-ES", {maximumFractionDigits: 2}) + " %" : "—";
async function verSeguimiento(dias) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === "anuncios"));
  app.innerHTML = `<div class="vacio">Cargando el seguimiento…</div>`;
  let d; try { d = await api("seguimiento", null, {dias: dias || 30}); } catch (e) { if (e.message !== "sin sesión") app.innerHTML = `<div class="card">${E(e.message)}</div>`; return; }
  const vivas = d.cajas.filter(c => c.estado === "activo" || (c.cifras && c.cifras.impresiones) || (c.piezas || []).length);
  const resto = d.cajas.filter(c => !vivas.includes(c));
  const tot = vivas.reduce((t, c) => [t[0] + ((c.cifras||{}).impresiones||0), t[1] + ((c.cifras||{}).clics||0)], [0, 0]);
  const tabla = (o, n) => Object.entries(o || {}).sort((a, b) => b[1][0] - a[1][0]).slice(0, n).map(([k, v]) => `<div class="paso"><span>${E(k)}</span><span class="mute">${num(v[0])} vistas · ${num(v[1])} clics</span></div>`).join("") || `<p class="mute">Sin datos.</p>`;
  const caja = c => { const x = c.cifras || {}, comp = c.comprobaciones || [], u = comp[0];
    return `<div class="card" data-c="${E(c.id)}"><div class="row" style="justify-content:space-between"><h2>${E(c.nombre)}</h2><span class="chip ${c.estado==="activo"?"pub":""}">${E(c.estado || "")}</span></div>
    <p class="mute">${E(c.anunciante || "")} · ${E(c.tipo || "")}${c.nivel ? " · " + E(c.nivel) : ""}<br>Publicada: ${fh(c.publicada)} · Retirada: ${fh(c.retirada)}${c.inicio || c.fin ? `<br>Programada: ${E(c.inicio || "")} → ${E(c.fin || "")}` : ""}</p>
    <div class="kpi"><div><b>${num(x.impresiones || 0)}</b><span class="mute">vistas</span></div><div><b>${num(x.clics || 0)}</b><span class="mute">clics</span></div><div><b>${pct(x.clics || 0, x.impresiones || 0)}</b><span class="mute">CTR</span></div></div>
    <p class="mute" style="margin-top:8px">${c.comprobado_hoy ? `<b style="color:${c.comprobado_hoy.ok ? "var(--acc)" : "var(--bad)"}">Comprobado hoy a las ${E(new Date(c.comprobado_hoy.at).toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid"}))} · ${c.comprobado_hoy.ok ? "funciona" : "no funciona"}</b><br>` : (c.estado === "activo" ? "Hoy todavía sin comprobar (pasa una vez al día, a hora al azar entre las 9 y las 21).<br>" : "")}${u ? `Última: ${u.ok ? "✓ funciona" : "✗ " + E(u.error || "falla")} · ${fh(u.at)} · ${u.estado || "—"} · ${u.ms} ms${u.origen === "manual" ? " · a mano" : ""}` : "Comprobador: todavía sin pasar."}
    ${u ? ` · <a href="/api/gestor?a=comprobaciones_csv&anuncio=${encodeURIComponent(c.id)}&dias=30">Descargar 30 días (CSV)</a>` : ""}</p>
    ${c.ampliado ? (() => { const A = c.ampliado, t = A.totales || {}, NOM = {vista: "vistas", clic: "clics", cta: "clics en el botón", form_abierto: "formularios abiertos", form_enviado: "formularios enviados"};
      const dim = (o, n) => Object.entries(o || {}).sort((a, b) => (b[1].vista || 0) - (a[1].vista || 0)).slice(0, n).map(([k, v]) => `<div class="paso"><span>${E(k)}</span><span class="mute">${num(v.vista || 0)} vistas · ${num(v.clic || 0)} clics${v.cta ? " · " + num(v.cta) + " botón" : ""}${v.form_enviado ? " · " + num(v.form_enviado) + " formularios" : ""}</span></div>`).join("");
      return `<div class="kpi" style="margin-top:8px">${["cta", "form_abierto", "form_enviado"].filter(k => t[k] != null || k === "cta").map(k => `<div><b>${num(t[k] || 0)}</b><span class="mute">${NOM[k]}</span></div>`).join("")}</div>
        <details><summary>Procedencia</summary>${dim(A.procedencia, 12)}</details><details><summary>Dispositivo</summary>${dim(A.dispositivo, 3)}</details><details><summary>Sección</summary>${dim(A.seccion, 12)}</details>`; })() : ""}
    <details><summary>Posiciones (${(c.huecos || []).length})</summary><p class="mute">Configuradas: ${E((c.huecos || []).join(", ") || "—")}</p>${tabla(x.huecos, 10)}</details>
    <details><summary>Dónde se vio (contextos)</summary>${tabla(x.paginas, 15)}</details>
    ${(c.piezas || []).length ? `<details><summary>Piezas con esta caja (${c.piezas.length})</summary>${c.piezas.map(p => `<div class="paso"><div>${E(p.titulo)}<br><span class="mute">${E(p.posicion)} · ${E(p.estado)} · publicada ${fh(p.publicada)}${p.retirada ? " · retirada " + fh(p.retirada) : ""}</span></div></div>`).join("")}</details>` : ""}
    ${comp.length > 1 ? `<details><summary>Últimas comprobaciones</summary>${comp.map(k => `<div class="paso"><span>${k.ok ? "✓" : "✗"} ${fh(k.at)} · ${k.estado || "—"} · ${k.ms} ms</span><span class="mute">${E(k.origen)}${k.error ? " · " + E(k.error) : ""}</span></div>`).join("")}</details>` : ""}
    ${puede("publicidad") && c.url ? `<p><button class="b2" data-comp="${E(c.id)}">Comprobar ahora</button></p>` : ""}</div>`; };
  app.innerHTML = `<p class="row"><button class="b2" id="volver">← Publicidad</button></p>
    <div class="card"><h1>Seguimiento</h1><p class="mute">Últimos ${d.dias} días. Vistas: la caja se vio al menos a medias en pantalla. Clics: un lector pulsó su enlace. No cuentan ni los robots, ni tus propias visitas como editor jefe, ni el comprobador, que visita cada enlace una vez al día, a hora al azar entre las 9 y las 21, para demostrar que el destino responde (historial descargable para el anunciante; si falla dos veces seguidas, te llega un correo).</p>
    <div class="kpi"><div><b>${num(tot[0])}</b><span class="mute">vistas</span></div><div><b>${num(tot[1])}</b><span class="mute">clics</span></div><div><b>${pct(tot[1], tot[0])}</b><span class="mute">CTR</span></div></div>
    <div class="filtros" style="margin-top:10px">${[7, 30, 90].map(n => `<button data-d="${n}" class="${n===d.dias?"on":""}">${n} días</button>`).join("")}</div>
    ${puede("publicidad") ? `<button class="b2" id="todas">Comprobar todos los enlaces ahora</button>` : ""}</div>
    ${vivas.map(caja).join("")}${resto.length ? `<details class="card"><summary>Sin actividad (${resto.length})</summary>${resto.map(caja).join("")}</details>` : ""}`;
  $("#volver").onclick = () => ir("anuncios");
  app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => verSeguimiento(+b.dataset.d));
  const comprobar = async (b, anuncio) => { b.disabled = true; b.innerHTML = `<span class="spin"></span>Comprobando…`;
    try { const r = await api("comprobar", anuncio ? {anuncio} : {}); const mal = r.resultados.filter(x => !x.ok);
      aviso(mal.length ? `${mal.length} enlace(s) fallan: ${mal.map(x => x.nombre).join(", ")}` : `${r.resultados.length} enlace(s) funcionan`, !!mal.length); verSeguimiento(d.dias); }
    catch (e) { aviso(e.message, true); b.disabled = false; } };
  const t = $("#todas"); if (t) t.onclick = () => comprobar(t);
  app.querySelectorAll("[data-comp]").forEach(b => b.onclick = () => comprobar(b, b.dataset.comp));
}

// ---------- Nueva noticia desde el gestor (editor y editor jefe) ----------
async function verNoticia() {
  app.innerHTML = `<div class="vacio">Cargando…</div>`;
  let d = {encargos: [], dominios: [], clases: {}}; try { d = await api("encargos"); } catch (e) { if (e.message === "sin sesión") return; }
  const EST_E = {pendiente: ["pro", "En cola"], en_curso: ["pro", "La redacción está en ello"], publicada: ["pub", "Publicada"], pendiente_aprobacion: ["pro", "Espera al editor jefe"], sin_fuentes: ["ret", "Sin fuente primaria: no se publicó"], descartado: ["", "Descartada"]};
  app.innerHTML = `<div class="card jefe"><h1>Nueva noticia</h1>
    <p class="mute">Pega un texto (una nota de prensa, un aviso, una idea) o un enlace, o las dos cosas. La redacción lo investiga con el método de siempre —fuente primaria, verificación, reportaje completo— y escribe la pieza. Sin fuente primaria no se publica.</p>
    <label>Texto o enlace</label><textarea id="nt" style="min-height:220px" placeholder="Pega aquí el texto o el enlace (https://…)"></textarea>
    <label>Qué hacer</label>
    <label class="chk"><input type="radio" name="op" value="1" checked> <span><b>1. Investiga y crea la noticia</b> con publicación hoy mismo${jefe() ? "" : " (como editor, queda escrita para que el editor jefe la apruebe)"}.</span></label>
    <label class="chk"><input type="radio" name="op" value="2"> <span><b>2. Igual que 1 y registra el dominio de la fuente</b> (todas sus noticias, no solo esta) como:</span></label>
    <div id="clases" hidden style="margin-left:26px">${Object.entries(d.clases || {}).map(([k, t]) => `<label class="chk"><input type="radio" name="cl" value="${k}"> <span>${E(t)}</span></label>`).join("")}
      <p class="mute">«No de confianza»: lo que venga de ese dominio se revisa siempre y pasa a la cola del editor jefe antes de publicarse.${jefe() ? "" : " Lo que registres tú queda sin confirmar (y se trata como no de confianza) hasta que lo vea el editor jefe."}</p></div>
    <p><button class="b" id="enviar" style="width:100%">Encargar a la redacción</button></p>
    <p class="mute">La rutina de la redacción pasa cada hora en laborables, de 8 a 21. Lo que pegues se guarda en la base privada, no en el repositorio.</p></div>
    <div class="card"><h2>Encargos recientes</h2>${(d.encargos || []).map(e => { const x = EST_E[e.estado] || ["", e.estado];
      return `<div class="paso"><div><span class="mute">${fh(e.creado_at)} · ${E(e.pedido_por)}${e.dominio ? " · " + E(e.dominio) : ""}</span><br>${E(e.texto)}${e.pieza ? `<br><a href="https://www.moticias.com/${E(e.pieza)}/" target="_blank" rel="noopener">Ver la pieza ↗</a>` : ""}${e.resultado ? `<br><span class="mute">${E(e.resultado)}</span>` : ""}</div><span class="chip ${x[0]}">${E(x[1])}</span></div>`; }).join("") || `<p class="mute">Ninguno todavía.</p>`}</div>
    <details class="card"><summary>Fuentes registradas por dominio (${(d.dominios || []).length})</summary>${(d.dominios || []).map(x => `<div class="paso"><div><b>${E(x.dominio)}</b><br><span class="mute">${E((d.clases || {})[x.clase] || x.clase)}${x.confirmado ? "" : " · sin confirmar"} · ${E(x.por || "")}</span></div>
      ${jefe() ? `<select data-dom="${E(x.dominio)}">${Object.entries(d.clases || {}).map(([k, t]) => `<option value="${k}" ${k===x.clase?"selected":""}>${E(t.split(" (")[0])}</option>`).join("")}</select>${x.confirmado ? "" : `<button class="b2" data-conf="${E(x.dominio)}" data-cl="${E(x.clase)}">Confirmar</button>`}` : ""}</div>`).join("") || `<p class="mute">Ninguna.</p>`}</details>`;
  app.querySelectorAll('input[name="op"]').forEach(r => r.onchange = () => { $("#clases").hidden = app.querySelector('input[name="op"]:checked').value !== "2"; });
  $("#enviar").onclick = async ev => {
    const texto = $("#nt").value.trim(), op = +app.querySelector('input[name="op"]:checked').value, cl = app.querySelector('input[name="cl"]:checked');
    if (texto.length < 10) return aviso("Pega un texto o un enlace", true);
    if (op === 2 && !cl) return aviso("Elige cómo registrar la fuente", true);
    ev.target.disabled = true;
    try { const r = await api("encargo", {texto, opcion: op, clase_fuente: cl ? cl.value : null}); aviso(r.aviso + (r.fuente ? " · " + r.fuente : "")); verNoticia(); }
    catch (e) { aviso(e.message, true); ev.target.disabled = false; }
  };
  const dom = async (dominio, clase) => { try { const r = await api("dominio", {dominio, clase}); aviso(r.detalle); verNoticia(); } catch (e) { aviso(e.message, true); } };
  app.querySelectorAll("[data-dom]").forEach(s => s.onchange = () => dom(s.dataset.dom, s.value));
  app.querySelectorAll("[data-conf]").forEach(b => b.onclick = () => dom(b.dataset.conf, b.dataset.cl));
}
// ---------- Agenda de eventos e «Inicio» (cambio agenda-de-eventos, 16-11-2026) ----------
// Pestaña «Agenda»: cola «Por revisar» (lo que suben organizadores y encuentra el barrido), publicados con filtros,
// por confirmar, retirados, «Organizadores y responsables» y alta manual. Publicar, retirar y restaurar: solo el editor
// jefe (el servidor responde 403 a los demás). «Inicio»: el bloque «Agenda» y las cifras de las demás áreas.
const AG = {pest: "cola", sel: new Set(), d: null, f: {tema: "", mes: "", ter: ""}};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const agFecha = e => !e.inicio ? (e.mes_previsto ? MESES[+e.mes_previsto.slice(5) - 1] + " " + e.mes_previsto.slice(0, 4) + " (por confirmar)" : "sin fecha")
  : e.fin && e.fin !== e.inicio ? `${e.inicio.slice(8)}/${e.inicio.slice(5, 7)} – ${e.fin.slice(8)}/${e.fin.slice(5, 7)}/${e.fin.slice(0, 4)}` : `${e.inicio.slice(8)}/${e.inicio.slice(5, 7)}/${e.inicio.slice(0, 4)}`;
const agTema = id => ((AG.d && AG.d.cfg.temas) || []).find(t => t.id === id) || {nombre: id, color: "#ccc"};
const agChipTema = id => { const t = agTema(id); return `<span class="chip" style="background:#fff;border:1px solid var(--line)"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${E(t.color)};border:1px solid #999;margin-right:4px"></i>${E(t.nombre)}</span>`; };
const AGEST = {propuesto: ["pro", "Por revisar"], publicado: ["pub", "Publicado"], fecha_por_confirmar: ["pro", "Fecha por confirmar"], aplazado: ["pro", "Aplazado"], cancelado: ["ret", "Cancelado"], retirado: ["ret", "Retirado"], pasado: ["", "Pasado"]};
const agEst = e => { const x = AGEST[e] || ["", e]; return `<span class="chip ${x[0]}">${E(x[1])}</span>`; };

async function verAgenda(pest) {
  if (pest) AG.pest = pest;
  AG.sel.clear();
  app.innerHTML = `<div class="vacio"><span class="spin"></span>Cargando la agenda…</div>`;
  try { AG.d = await api("agenda"); } catch (e) { if (e.message !== "sin sesión") app.innerHTML = `<div class="card">${E(e.message)}</div>`; return; }
  pintarAgenda();
}

function pintarAgenda() {
  const d = AG.d, J = d.jefe, nCola = d.envios.length + d.propuestos.length;
  const tabs = [["cola", `Por revisar · ${nCola}`], ["publicados", `Publicados · ${d.publicados.length}`], ["confirmar", `Por confirmar · ${d.por_confirmar.length}`],
    ["retirados", `Retirados · ${d.retirados.length}`]].concat(puede("crm") ? [["organizadores", "Organizadores y responsables"]] : []).concat([["nuevo", "+ Nuevo evento"]]);
  app.innerHTML = `<div class="card"><h1>Agenda</h1><p class="mute">Ferias, congresos y jornadas de moticias.com/agenda/. ${J ? "Tú publicas, retiras y restauras." : "Tú propones; publica el editor jefe."} Nada se borra: retirar deja el evento guardado.</p>
    <div class="row"><a class="b2" href="https://www.moticias.com/agenda/" target="_blank" rel="noopener">Ver la agenda ↗</a></div></div>
    <div class="tabs" id="ag-tabs">${tabs.map(([k, t]) => `<button data-p="${k}" class="${AG.pest === k ? "on" : ""}">${E(t)}</button>`).join("")}</div><div id="ag-cuerpo"></div>`;
  $("#ag-tabs").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; AG.pest = b.dataset.p; AG.sel.clear(); pintarAgenda(); };
  const c = $("#ag-cuerpo");
  ({cola: agCola, publicados: agPublicados, confirmar: agConfirmar, retirados: agRetirados, organizadores: agOrganizadores, nuevo: () => agEditor(null)})[AG.pest](c);
  agBloque();
}

function agTarjeta(e, botones) {
  const err = (e.errores || []).length ? `<div class="warn">Le falta para publicarse: ${E(e.errores.join("; "))}</div>` : "";
  const dup = (e.duplicados || []).length ? `<div class="warn">¿Duplicado? ${e.duplicados.map(x => E(x.titulo + " (" + (x.inicio || "") + ", " + (x.ciudad || "") + ", " + x.estado + ")")).join(" · ")}</div>` : "";
  const caido = e.caido ? `<span class="chip ret">Enlace caído</span>` : "";
  return `<div class="q-it" data-id="${E(e.id)}"><div class="q-cab"><input type="checkbox" data-sel="${E(e.id)}" ${AG.sel.has(e.id) ? "checked" : ""} aria-label="Seleccionar">
    <div class="q-cu"><div class="q-l1">${agEst(e.estado)} ${agChipTema(e.tema)} <span>${E(agFecha(e))}</span> ${caido}</div>
    <div class="q-t">${E(e.titulo)}</div><div class="mute"><b>${E(e.ciudad)}</b>${e.sede ? " · " + E(e.sede) : ""} · ${E((e.organizadores || []).join(" y "))}</div>
    <details><summary>Ficha</summary><div class="prev"><p>${E(e.resumen)}</p><p class="mute">${E(e.formato)} · ${E(e.modalidad || "")} · ${e.publico === "general" ? "Abierta al público" : "Profesional"}${e.precio ? " · " + E(e.precio) : ""}</p>
      ${e.nota ? `<p class="mute">${E(e.nota)}</p>` : ""}<p>${e.url_inscripcion ? `<a href="${E(e.url_inscripcion)}" target="_blank" rel="noopener">Inscripción ↗</a>` : "sin enlace"}</p>
      <p class="mute">Fuentes: ${(e.fuentes || []).map(f => `<a href="${E(f.url)}" target="_blank" rel="noopener">${E(f.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0])}</a> (${E(f.fecha)})`).join(" · ")}${e.comprobado_at ? " · última comprobación " + E(e.comprobado_at) : ""}</p></div></details>
    ${err}${dup}</div></div><div class="q-acc">${botones}</div></div>`;
}
const agBtn = (acc, txt, id, cls) => `<button class="b2 ${cls || ""}" data-acc="${acc}" data-id="${E(id)}">${E(txt)}</button>`;

function agCola(c) {
  const d = AG.d, J = d.jefe;
  const envios = d.envios.map(x => `<div class="q-it"><div class="q-cab"><div class="q-cu"><div class="q-l1"><span class="chip pro">Organizador · ${E(x.estado === "datos_pedidos" ? "datos pedidos" : x.estado === "en_revision" ? "en revisión" : "recibido")}</span> ${agChipTema(x.evento.tema)} <span>${E(x.evento.inicio)}</span></div>
    <div class="q-t">${E(x.evento.titulo)}</div><div class="mute"><b>${E(x.evento.ciudad)}</b> · ${E(x.entidad.nombre)}${x.entidad.web ? ` · <a href="${E(x.entidad.web)}" target="_blank" rel="noopener">web ↗</a>` : ""} · recibido ${E(x.creado_at.slice(0, 10))}</div>
    <p class="mute">${E(x.evento.resumen)}</p><p><a href="${E(x.evento.url_inscripcion)}" target="_blank" rel="noopener">Inscripción ↗</a></p>
    ${x.duplicados.length ? `<div class="warn">¿Duplicado? ${x.duplicados.map(y => E(y.titulo + " (" + y.estado + ")")).join(" · ")}</div>` : ""}</div></div>
    <div class="q-acc">${x.evento_id ? `<span class="mute">En la cola como ${E(x.evento_id)}</span>` : `<button class="b2" data-env="convertir" data-id="${x.id}">Pasar a revisión</button>`}<button class="b2" data-env="pedir_datos" data-id="${x.id}">Pedir datos</button><button class="b2 bad" data-env="descartar_envio" data-id="${x.id}">Descartar</button></div></div>`).join("");
  const props = d.propuestos.map(e => agTarjeta(e, (J ? agBtn("publicar", "Publicar", e.id) : "") + agBtn("editar", "Editar", e.id) + agBtn("comprobar_enlace", "Comprobar enlace", e.id) +
    agBtn("fecha_por_confirmar", "Fecha por confirmar", e.id) + (J ? agBtn("retirar", "Retirar", e.id, "bad") : ""))).join("");
  c.innerHTML = (envios ? `<h2>Enviados por organizadores</h2>${envios}` : "") + (props ? `<h2>Por revisar</h2>${props}` : "") || `<div class="vacio">Nada por revisar.</div>`;
  agEnlaces(c);
}

function agPublicados(c) {
  const d = AG.d, J = d.jefe, f = AG.f;
  const meses = [...new Set(d.publicados.filter(e => e.inicio).map(e => e.inicio.slice(0, 7)))].sort();
  const lista = d.publicados.filter(e => (!f.tema || e.tema === f.tema) && (!f.ter || e.territorio === f.ter) && (!f.mes || (e.inicio || "").slice(0, 7) <= f.mes && (e.fin || e.inicio || "").slice(0, 7) >= f.mes));
  c.innerHTML = `<div class="q-herr"><select id="ag-ft"><option value="">Todos los temas</option>${d.cfg.temas.map(t => `<option value="${t.id}" ${f.tema === t.id ? "selected" : ""}>${E(t.nombre)}</option>`).join("")}</select>
    <select id="ag-fm"><option value="">Todos los meses</option>${meses.map(m => `<option value="${m}" ${f.mes === m ? "selected" : ""}>${MESES[+m.slice(5) - 1]} ${m.slice(0, 4)}</option>`).join("")}</select>
    <select id="ag-fr"><option value="">Todas las comunidades</option>${d.territorios.map(t => `<option value="${t.id}" ${f.ter === t.id ? "selected" : ""}>${E(t.nombre)}</option>`).join("")}</select></div>
    ${lista.map(e => agTarjeta(e, agBtn("editar", "Editar", e.id) + agBtn("comprobar_enlace", "Comprobar enlace", e.id) + (J ? agBtn("aplazado", "Aplazado", e.id) + agBtn("cancelado", "Cancelado", e.id) +
      agBtn("fecha_por_confirmar", "Fecha por confirmar", e.id) + agBtn("retirar", "Retirar", e.id, "bad") : ""))).join("") || `<div class="vacio">Ninguno con esos filtros.</div>`}
    <p class="mute">${d.pasados} eventos ya celebrados en el archivo.</p>`;
  [["#ag-ft", "tema"], ["#ag-fm", "mes"], ["#ag-fr", "ter"]].forEach(([s, k]) => $(s).onchange = () => { AG.f[k] = $(s).value; agPublicados(c); });
  agEnlaces(c);
}
function agConfirmar(c) {
  const J = AG.d.jefe;
  c.innerHTML = AG.d.por_confirmar.map(e => agTarjeta(e, agBtn("editar", "Editar (poner fecha)", e.id) + (J ? agBtn("retirar", "Retirar", e.id, "bad") : ""))).join("") || `<div class="vacio">Ninguno.</div>`;
  agEnlaces(c);
}
function agRetirados(c) {
  const J = AG.d.jefe;
  c.innerHTML = AG.d.retirados.map(e => agTarjeta(e, J ? agBtn("restaurar", "Restaurar", e.id) : `<span class="mute">Solo el editor jefe restaura.</span>`)).join("") || `<div class="vacio">Ninguno.</div>`;
  agEnlaces(c);
}

async function agOrganizadores(c) {
  c.innerHTML = `<div class="vacio"><span class="spin"></span>Cargando…</div>`;
  let r; try { r = await api("agenda_organizadores"); } catch (e) { c.innerHTML = `<div class="card">${E(e.message)}</div>`; return; }
  const k = r.contadores, ESTC = {"Contacto directo": "pub", "Contacto general": "pub", "Contacto general · falta responsable": "pro", "Falta contacto": "ret"};
  const dato = x => x ? `${E(x.valor)} <span class="mute">(${E(x.nivel)}; <a href="${E(x.fuente)}" target="_blank" rel="noopener">fuente</a>, ${E(x.fecha)})</span>` : `<span class="mute">por localizar</span>`;
  c.innerHTML = `<div class="card"><div class="kpi"><div><b>${k.eventos}</b>eventos</div><div><b>${k.entidades}</b>entidades</div><div><b>${k.responsables}</b>responsables con nombre</div>
    <div><b>${k.entidades_con_contacto}</b>entidades con correo o teléfono</div><div><b>${k.eventos_sin_responsable}</b>eventos sin responsable</div><div><b>${k.entidades_sin_contacto}</b>entidades sin contacto</div></div>
    <p class="mute">Solo contactos que publica el propio organizador o una fuente identificable, con su fuente y su fecha. Un contacto público no es un permiso comercial.</p></div>
    ${r.filas.map(x => `<button class="item" data-cuenta="${x.cuenta_id}"><div class="q-l1"><span class="chip ${ESTC[x.estado] || ""}">${E(x.estado)}</span> <span>${E(x.inicio || "")}</span></div>
      <div class="t">${E(x.entidad)}</div><div class="mute">${E(x.evento)}</div>
      <div style="font-size:14px;margin-top:6px">Responsable: ${x.responsable ? `<b>${E(x.responsable)}</b>${x.cargo ? " · " + E(x.cargo) : ""}` : `<span class="mute">por identificar</span>`}<br>
      Correo: ${dato(x.correo)}<br>Teléfono: ${dato(x.telefono)}<br>Web: ${x.web ? E(x.web) : `<span class="mute">por localizar</span>`}${x.enlace ? ` · <span class="mute">evento:</span> ${E(x.enlace.replace(/^https?:\/\//, "").slice(0, 60))}` : ""}</div></button>`).join("") || `<div class="vacio">Aún no hay organizadores: se crean al publicar cada evento.</div>`}`;
  c.querySelectorAll("[data-cuenta]").forEach(b => b.onclick = ev => { if (ev.target.closest("a")) return; fichaCrm(b.dataset.cuenta); });
}

function agEnlaces(c) {
  c.querySelectorAll("[data-sel]").forEach(x => x.onchange = () => { x.checked ? AG.sel.add(x.dataset.sel) : AG.sel.delete(x.dataset.sel); agBloque(); });
  c.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => agAccion(b.dataset.acc, [b.dataset.id], b));
  c.querySelectorAll("[data-env]").forEach(b => b.onclick = () => agEnvio(b.dataset.env, b.dataset.id, b));
}
function agBloque() {
  let q = $("#q-bloque"); if (q) q.remove(); document.body.classList.remove("q-con-bloque");
  if (!AG.sel.size || vista !== "agenda") return;
  const J = AG.d.jefe;
  q = document.createElement("div"); q.id = "q-bloque"; q.className = "q-bloque";
  q.innerHTML = `<b>${AG.sel.size} seleccionados</b>` + (J ? `<button class="b" data-b="publicar">Publicar</button>` : "") +
    `<button class="b2" data-b="fecha_por_confirmar">Fecha por confirmar</button>` + (J ? `<button class="b2" data-b="aplazado">Aplazado</button><button class="b2" data-b="cancelado">Cancelado</button><button class="b2 bad" data-b="retirar">Retirar</button>` : "") +
    `<button class="b2" data-b="">Quitar selección</button>`;
  q.onclick = ev => { const b = ev.target.closest("button"); if (!b) return; if (!b.dataset.b) { AG.sel.clear(); pintarAgenda(); return; } agAccion(b.dataset.b, [...AG.sel], b); };
  document.body.appendChild(q); document.body.classList.add("q-con-bloque");
}

async function agAccion(acc, ids, b) {
  if (acc === "editar") return agEditor(AG.d.propuestos.concat(AG.d.publicados, AG.d.por_confirmar, AG.d.retirados).find(e => e.id === ids[0]));
  const nombres = {publicar: "Publicar", retirar: "Retirar", restaurar: "Restaurar", fecha_por_confirmar: "Marcar «fecha por confirmar»", aplazado: "Marcar aplazado", cancelado: "Marcar cancelado"};
  let motivo = null;
  if (acc === "retirar") { motivo = prompt("Motivo de la retirada (queda en el historial; el evento no se borra):"); if (motivo === null) return; }
  else if (nombres[acc] && !confirm(nombres[acc] + (ids.length > 1 ? ` ${ids.length} eventos` : "") + "?" + (acc === "publicar" ? "\n\nPublicar es decir que has comprobado fecha, sede y enlace en la web del organizador." : ""))) return;
  if (b) b.disabled = true;
  try {
    const r = await api("agenda", {accion: acc, ids, motivo});
    if (acc === "comprobar_enlace") { const x = (r.resultados || [])[0]; aviso(x ? (x.ok ? "El enlace responde (" + x.estado_http + ")" : "El enlace NO responde: " + (x.error || x.estado_http)) : "Sin enlace que comprobar", x && !x.ok); if (b) b.disabled = false; return; }
    aviso((r.hechos || []).length + " hecho(s)" + ((r.errores || []).length ? " · " + r.errores.map(x => x.id + ": " + x.error).join(" | ") : "") + (r.web && r.web.ok ? " · web al día" : ""), (r.errores || []).length > 0);
    verAgenda();
  } catch (e) { aviso(e.message + (e.datos && e.datos.errores ? ": " + e.datos.errores.map(x => x.error).join(" | ") : ""), true); if (b) b.disabled = false; }
}
async function agEnvio(acc, id, b) {
  let extra = {};
  if (acc === "pedir_datos") { const m = prompt("¿Qué datos faltan? (se le escribe al remitente)"); if (!m) return; extra.mensaje = m; }
  if (acc === "descartar_envio") { const m = prompt("Motivo del descarte (queda en el historial):"); if (m === null) return; extra.motivo = m; }
  b.disabled = true;
  try { const r = await api("agenda", Object.assign({accion: acc, envio: id}, extra)); aviso(acc === "convertir" ? "En la cola como " + r.id + ": revísalo y publícalo" : "Hecho"); verAgenda(); }
  catch (e) { aviso(e.message, true); b.disabled = false; }
}

function agEditor(e) {
  const d = AG.d, nuevo = !e; e = e || {modalidad: "presencial", publico: "profesional", fuentes: [], organizadores: []};
  const vis = ["publicado", "aplazado", "cancelado"].includes(e.estado);
  if (vis && !d.jefe) return aviso("Este evento ya está en la web: lo cambia el editor jefe", true);
  const sel = (id, ops, val) => `<select id="${id}">${ops.map(([k, t]) => `<option value="${E(k)}" ${k === val ? "selected" : ""}>${E(t)}</option>`).join("")}</select>`;
  const inp = (id, val, t) => `<input id="${id}" type="${t || "text"}" value="${E(val ?? "")}">`;
  const velo = document.createElement("div"); velo.className = "q-velo"; const h = document.createElement("div"); h.className = "q-hoja";
  h.innerHTML = `<h2>${nuevo ? "Nuevo evento" : "Editar · " + E(e.titulo_corto || e.titulo)}</h2>
    <p class="mute">Cada fecha, sede y enlace, comprobado en la web del organizador. Lo que no se pudo comprobar se dice («sede por anunciar»). Nada de nombres, correos ni teléfonos aquí: van al CRM.</p>
    <label>Nombre</label>${inp("e-tit", e.titulo)}<label>Nombre corto (mapa y listas)</label>${inp("e-cor", e.titulo_corto)}
    <div class="grid2"><div><label>Inicio</label>${inp("e-ini", e.inicio, "date")}</div><div><label>Fin</label>${inp("e-fin", e.fin, "date")}</div></div>
    <label>Si la fecha no está confirmada: mes previsto (AAAA-MM)</label>${inp("e-mes", e.mes_previsto)}
    <div class="grid2"><div><label>Tema</label>${sel("e-tema", d.cfg.temas.map(t => [t.id, t.nombre]), e.tema)}</div><div><label>Formato</label>${sel("e-for", d.cfg.formatos.map(x => [x, x]), e.formato)}</div>
    <div><label>Modalidad</label>${sel("e-mod", d.cfg.modalidades.map(x => [x, x]), e.modalidad)}</div><div><label>Público</label>${sel("e-pub", Object.entries(d.cfg.publicos), e.publico)}</div></div>
    <div class="grid2"><div><label>Ciudad</label>${inp("e-ciu", e.ciudad)}</div><div><label>Comunidad</label>${sel("e-ter", d.territorios.map(t => [t.id, t.nombre]), e.territorio)}</div></div>
    <label>Sede</label>${inp("e-sed", e.sede)}
    <div class="grid2"><div><label>Latitud</label>${inp("e-lat", (e.geo || {}).lat, "number")}</div><div><label>Longitud</label>${inp("e-lon", (e.geo || {}).lon, "number")}</div></div>
    <label>Resumen (hasta 60 palabras)</label><textarea id="e-res">${E(e.resumen)}</textarea>
    <label>Organizan (una entidad por línea)</label><textarea id="e-org" style="min-height:60px">${E((e.organizadores || []).join("\n"))}</textarea>
    <label>Enlace de inscripción</label>${inp("e-ins", e.url_inscripcion, "url")}<label>Web oficial</label>${inp("e-ofi", e.url_oficial, "url")}
    <label>Precio</label>${inp("e-pre", e.precio)}<label>Nota (lo que falta o hay que saber)</label>${inp("e-not", e.nota)}
    <label>Fuentes (una por línea: URL | AAAA-MM-DD | nota)</label><textarea id="e-fue" style="min-height:70px">${E((e.fuentes || []).map(f => [f.url, f.fecha, f.nota || ""].join(" | ")).join("\n"))}</textarea>
    <div class="q-pie"><button class="b2" id="e-x">Cancelar</button>${nuevo ? `<button class="b" id="e-ok">Guardar como propuesto</button>${d.jefe ? `<button class="b" id="e-pub">Publicar</button>` : ""}` : `<button class="b" id="e-ok">Guardar</button>`}</div>`;
  document.body.append(velo, h);
  const cerrar = () => { velo.remove(); h.remove(); };
  velo.onclick = cerrar; $("#e-x").onclick = cerrar;
  const campos = () => {
    const v = id => $(id).value.trim(), num = id => v(id) === "" ? null : Number(v(id));
    const c = {titulo: v("#e-tit"), titulo_corto: v("#e-cor") || v("#e-tit").slice(0, 60), tema: v("#e-tema"), formato: v("#e-for"), modalidad: v("#e-mod"), publico: v("#e-pub"),
      ciudad: v("#e-ciu"), territorio: v("#e-ter"), sede: v("#e-sed"), resumen: v("#e-res"), organizadores: v("#e-org").split("\n").map(x => x.trim()).filter(Boolean),
      url_inscripcion: v("#e-ins") || null, url_oficial: v("#e-ofi") || null, precio: v("#e-pre") || null, nota: v("#e-not") || null,
      fuentes: v("#e-fue").split("\n").map(l => l.split("|").map(x => x.trim())).filter(x => x[0]).map(([url, fecha, nota]) => Object.assign({url, fecha}, nota ? {nota} : {}))};
    if (v("#e-ini")) { c.inicio = v("#e-ini"); c.fin = v("#e-fin") || v("#e-ini"); } else if (v("#e-mes")) c.mes_previsto = v("#e-mes");
    if (num("#e-lat") != null && num("#e-lon") != null) c.geo = {lat: num("#e-lat"), lon: num("#e-lon")};
    Object.keys(c).forEach(k => { if (c[k] === null) delete c[k]; });
    return c;
  };
  const guardar = async (publicar, b) => {
    b.disabled = true;
    try {
      const r = nuevo ? await api("agenda", {accion: "alta", campos: campos(), publicar}) : await api("agenda", {accion: "editar", ids: [e.id], campos: campos()});
      if (r.errores && r.errores.length) throw new Error(r.errores.map(x => x.error).join(" | "));
      aviso(nuevo ? (r.estado === "publicado" ? "Publicado" : "Guardado en la cola") + (r.duplicados && r.duplicados.length ? " · ojo: posible duplicado" : "") : "Guardado");
      cerrar(); verAgenda(nuevo && r.estado === "publicado" ? "publicados" : null);
    } catch (x) { aviso(x.message, true); b.disabled = false; }
  };
  $("#e-ok").onclick = ev => guardar(false, ev.target);
  const p = $("#e-pub"); if (p) p.onclick = ev => guardar(true, ev.target);
}

async function agAbrirEnvio(id) {
  await verAgenda("cola");
  const n = app.querySelector(`[data-env][data-id="${CSS.escape(id)}"]`);
  if (n) { n.closest(".q-it").scrollIntoView({block: "center"}); n.closest(".q-it").classList.add("sel"); }
}
async function agAbrirEvento(id, acc) {
  await verAgenda("publicados");
  const todos = AG.d.propuestos.concat(AG.d.publicados, AG.d.por_confirmar, AG.d.retirados);
  const e = todos.find(x => x.id === id);
  if (!e) return aviso("No encuentro ese evento", true);
  if (acc === "retirar") return agAccion("retirar", [id]);
  agEditor(e);
}

// Contactos de una cuenta del CRM (nivel y fuente) y eventos que organiza
function contactosHtml(f) {
  const cs = f.contactos || [], evs = f.eventos || [];
  if (!cs.length && !evs.length) return "";
  const NIV = {directo: "directo", prensa: "prensa", general: "general", centralita: "centralita"};
  return `<div class="card"><h2>Contactos</h2>${cs.map(x => `<div class="paso"><div><b>${E(x.canal)}</b> · ${E(x.valor)}<br><span class="mute">nivel ${E(NIV[x.nivel] || x.nivel)} · <a href="${E(x.fuente_url)}" target="_blank" rel="noopener">fuente</a> (${E(x.fuente_fecha)})${x.notas ? " · " + E(x.notas) : ""}</span></div></div>`).join("") || `<p class="mute">Falta contacto: por localizar (nada deducido).</p>`}
    ${evs.length ? `<p class="mute">Organiza en la agenda: ${evs.map(x => `<a href="https://www.moticias.com/agenda/${E(x.evento_id)}/" target="_blank" rel="noopener">${E(x.evento_id)}</a>`).join(" · ")}</p>` : ""}</div>`;
}

// ---------- «Inicio» ----------
async function verInicio() {
  app.innerHTML = `<div class="vacio"><span class="spin"></span>Cargando…</div>`;
  let r; try { r = await api("inicio"); } catch (e) { if (e.message !== "sin sesión") app.innerHTML = `<div class="card">${E(e.message)}</div>`; return; }
  const g = r.agenda, a = r.areas;
  const cifra = (n, t, ir, extra) => `<button class="item" data-ir="${ir}" ${extra ? `data-x="${E(extra)}"` : ""} style="display:flex;justify-content:space-between;align-items:center"><span>${E(t)}</span><b style="font-size:22px">${n == null ? "—" : n}</b></button>`;
  const b = g.ultimo_barrido;
  app.innerHTML = `<div class="card"><h1>Inicio</h1><p class="mute">Lo que pide atención hoy, de todas las áreas. Cada cifra abre su lista.</p></div>
    <div class="card"><h2>Agenda</h2>
      ${cifra(g.proximos_14.length, "Citas en los próximos 14 días", "agenda:publicados")}
      ${g.proximos_14.length ? `<p class="mute" style="margin:-4px 0 10px">${g.proximos_14.map(e => E(e.inicio.slice(8) + "/" + e.inicio.slice(5, 7) + " " + e.titulo + " (" + e.ciudad + ")")).join(" · ")}</p>` : ""}
      ${cifra(g.propuestos + g.envios, "Pendientes de revisar", "agenda:cola")}
      ${cifra(g.sin_responsable, "Eventos sin responsable", "agenda:organizadores")}
      ${cifra(g.sin_contacto, "Entidades sin contacto", "agenda:organizadores")}
      ${cifra(g.caidos.length, "Enlaces de inscripción caídos", "agenda:publicados")}
      ${cifra(g.cambios.length, "Cambios de fecha o sede detectados", "agenda:cola")}
      ${g.cambios.length ? g.cambios.slice(0, 5).map(x => `<div class="warn">${E(x.evento_id || "")}: ${E(x.detalle)} <button class="b2" data-resolver="${x.id}">Resuelto</button></div>`).join("") : ""}
      <p class="mute">Último barrido: ${b ? E(b.at.slice(0, 16).replace("T", " ")) + " · " + (b.ok ? "correcto" : "con errores") + (b.resumen ? " · " + E(b.resumen) : "") : "todavía no ha corrido"}. Última comprobación de la agenda: ${E(g.comprobado || "—")}.</p></div>
    <div class="card"><h2>Las demás áreas</h2>
      ${a.cola_nuevos != null ? cifra(a.cola_nuevos, "Temas nuevos en la cola del editor", "cola") : ""}
      ${a.piezas_pendientes != null ? cifra(a.piezas_pendientes, "Piezas pendientes de aprobación", "piezas") : ""}
      ${a.cajas_propuestas != null ? cifra(a.cajas_propuestas, "Cajas de contenido patrocinado propuestas", "piezas") : ""}
      ${a.retoques_abiertos != null ? cifra(a.retoques_abiertos, "Retoques abiertos", "piezas") : ""}
      ${a.pasos_hoy != null ? cifra(a.pasos_hoy, "Pasos del CRM para hoy o vencidos", "crm") : ""}
      ${a.publicidad_caidos != null ? cifra(a.publicidad_caidos, "Enlaces de publicidad que fallaron (24 h)", "anuncios") : ""}</div>`;
  app.querySelectorAll("[data-ir]").forEach(x => x.onclick = () => { const [v, p] = x.dataset.ir.split(":"); if (v === "agenda") { vista = "agenda"; document.querySelectorAll("#nav button").forEach(n => n.classList.toggle("on", n.dataset.v === "agenda")); verAgenda(p); } else ir(v); });
  app.querySelectorAll("[data-resolver]").forEach(x => x.onclick = async ev => { ev.stopPropagation(); x.disabled = true; try { await api("agenda", {accion: "resolver_aviso", aviso: +x.dataset.resolver}); verInicio(); } catch (e) { aviso(e.message, true); x.disabled = false; } });
}

arrancar();
</script>
